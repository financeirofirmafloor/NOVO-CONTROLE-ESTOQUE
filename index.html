<script>
const SUPABASE_URL = window.ESTOQUE_SUPABASE_URL || '';
const SUPABASE_ANON_KEY = window.ESTOQUE_SUPABASE_ANON_KEY || '';
const AUTHORIZED_EMAIL = 'estoquefirmafloor@gmail.com';
let supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
let backendEnabled=false;
async function startSharedMode(){
 if(!supabaseClient){ document.getElementById('authError').textContent='O acesso compartilhado ainda não foi configurado. Preencha o config.js com os dados do Supabase.'; return; }
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(session) await onSignedIn(session);
 supabaseClient.auth.onAuthStateChange((_event,session)=>{ if(session) onSignedIn(session); else onSignedOut(); });
}
async function onSignedIn(session){
 document.getElementById('authGate').style.display='none';
 const email=session.user.email||'Usuário'; const label=document.querySelector('.user label'); if(label) label.textContent='Olá, '+email;
 backendEnabled=true;
 try { const profile=await supabaseClient.from('profiles').select('role,full_name').eq('id',session.user.id).maybeSingle(); window.appRole=profile.data?.role||'operador'; const label=document.querySelector('.user label'); if(label&&profile.data?.full_name) label.textContent='Olá, '+profile.data.full_name; } catch(e) { window.appRole='operador'; }
 try{ const {data:remote}=await supabaseClient.from('app_state').select('payload').eq('id','main').maybeSingle(); if(remote&&remote.payload){ data=remote.payload; data.movements=Array.isArray(data.movements)?data.movements:[]; saveLocalOnly(); show(current); } else { await pushSharedState(); } }catch(e){ console.warn('Sincronização indisponível',e); }
 const channel=supabaseClient.channel('estoqueflow-state').on('postgres_changes',{event:'*',schema:'public',table:'app_state'},payload=>{ if(payload.new?.payload){ data=payload.new.payload; saveLocalOnly(); show(current); }}).subscribe();
}
function saveLocalOnly(){localStorage.setItem('estoqueflow-data',JSON.stringify(data));}
async function pushSharedState(){ if(!backendEnabled||!supabaseClient)return; await supabaseClient.from('app_state').upsert({id:'main',payload:data,updated_at:new Date().toISOString()}); }

function togglePasswordVisibility(){const input=document.getElementById('authPassword'), check=document.getElementById('showPassword'); if(input&&check) input.type=check.checked?'text':'password';}
async function logout(){ try{ if(supabaseClient) await supabaseClient.auth.signOut(); } finally { onSignedOut(); } }
function onSignedOut(){ backendEnabled=false; const gate=document.getElementById('authGate'); if(gate) gate.style.display='grid'; const password=document.getElementById('authPassword'); if(password) password.value=''; const check=document.getElementById('showPassword'); if(check){check.checked=false; togglePasswordVisibility();} }

async function authSubmit(){ const email=document.getElementById('authEmail').value.trim().toLowerCase(), password=document.getElementById('authPassword').value, err=document.getElementById('authError'); err.textContent=''; if(email!==AUTHORIZED_EMAIL){err.textContent='Use o e-mail corporativo autorizado.';return;} if(!supabaseClient){err.textContent='O acesso compartilhado ainda não foi configurado.';return;} const result=await supabaseClient.auth.signInWithPassword({email,password}); if(result.error) err.textContent=result.error.message; }
document.addEventListener('DOMContentLoaded',()=>{ document.getElementById('authForm').onsubmit=e=>{e.preventDefault();authSubmit()}; startSharedMode(); });
</script>

function renderProducts(){let q=($('#prodSearch')?.value||'').toLowerCase();$('#products').innerHTML=`<div class="hero"><div><h2>Produtos</h2><p>${data.products.length} produtos cadastrados, sem duplicidade por código.</p></div><button class="primary" onclick="openProductForm()">＋ Adicionar produto</button></div><div class="toolbar"><input class="search" id="prodSearch" value="${esc(q)}" placeholder="Pesquisar por código ou produto..." oninput="renderProducts()"></div><div class="bulk-toolbar"><span class="bulk-count" id="productBulkCount">0 selecionados</span><button class="secondary" onclick="toggleAllProducts()">Selecionar todos</button><button class="secondary" onclick="openBulkProductEdit()">Alterar selecionados</button><button class="secondary" style="color:var(--red)" onclick="bulkDeleteProducts()">Excluir selecionados</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th class="check-cell"><input class="select-all" id="productSelectAll" type="checkbox" onchange="toggleAllProducts(this.checked)"></th><th>Código</th><th>Produto</th><th>Categoria</th><th>Mínimo</th><th>Máximo</th><th>Vendidos</th><th>Status</th><th>Ações</th></tr></thead><tbody>${data.products.filter(p=>!q||[p.code,p.name].join(' ').toLowerCase().includes(q)).map(p=>{let st=productStats(p),sel=new Set(getSelected('product'));return `<tr><td class="check-cell"><input class="row-check product-check" type="checkbox" value="${esc(p.code)}" ${sel.has(String(p.code))?'checked':''} onchange="updateBulkCount('product')"></td><td>${esc(p.code)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${p.min??0}</td><td>${p.max??0}${Number(p.min||0)>Number(p.max||0)?'<br><span class="invalid-limit">configuração inválida</span>':''}</td><td>${st.sold}</td><td>${purchasePill(st)}</td><td class="stock-actions"><button class="secondary" style="padding:6px 8px;font-size:10px" onclick="openMovementForm('${esc(p.code)}')">Movimentar</button><button class="secondary" style="padding:6px 8px;font-size:10px" onclick="editProduct('${esc(p.code)}')">Alterar</button><button class="secondary" style="padding:6px 8px;font-size:10px;color:var(--red)" onclick="deleteProduct('${esc(p.code)}')">Excluir</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Nenhum produto encontrado.</td></tr>'}</tbody></table></div></div>`;setTimeout(()=>updateBulkCount('product'),0)}
function renderMovements(){let q=($('#movementSearch')?.value||'').toLowerCase();$('#movements').innerHTML=`<div class="hero"><div><h2>Movimentações de estoque</h2><p>Registre entradas e saídas manualmente ou usando leitor USB.</p></div><button class="primary" onclick="openMovementForm()">＋ Nova movimentação</button></div><div class="scanner-hint">Conecte o leitor USB, clique no campo abaixo e escaneie o código. A leitura será tratada como teclado e terminará com Enter.</div><div class="toolbar"><input class="search barcode-input" id="barcodeSearch" placeholder="Escaneie ou digite o código de barras e pressione Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();openMovementForm(this.value.trim())}"><input class="search" id="movementSearch" value="${esc(q)}" placeholder="Pesquisar histórico..." oninput="renderMovements()"></div><div class="panel"><div class="panel-head"><h3>Histórico de movimentações</h3><span>${data.movements.length} registros</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Código</th><th>Produto</th><th>Quantidade</th><th>Observação</th></tr></thead><tbody>${data.movements.slice().reverse().filter(m=>!q||[m.code,m.name,m.note,m.type].join(' ').toLowerCase().includes(q)).map(m=>`<tr><td>${esc(m.date)}</td><td><span class="pill ${m.type==='entrada'?'green':'red'}">${m.type==='entrada'?'Entrada':'Saída'}</span></td><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${m.qty}</td><td>${esc(m.note||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma movimentação registrada.</td></tr>'}</tbody></table></div></div>`}
function show(v){current=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+v).classList.add('active');document.querySelectorAll('.nav button[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#pageTitle').textContent={dashboard:'Visão geral',sales:'Vendas e instalações',stock:'Resumo de estoque',products:'Produtos'}[v];if(v==='dashboard')renderDashboard();if(v==='sales')renderSales();if(v==='stock')renderStock();if(v==='movements')renderMovements();if(v==='products')renderProducts();$('#sidebar').classList.remove('open')}
function openForm(){let opts=data.products.map(p=>`<option>${esc(p.name)}</option>`).join('');$('#sales').innerHTML+=`<div class="panel" id="modal" style="position:fixed;inset:8%;z-index:10;overflow:auto;box-shadow:0 20px 70px #0d244066"><div class="panel-head"><h3>Registrar nova venda</h3><button onclick="$('#modal').remove()">✕</button></div><div class="panel-body"><form onsubmit="addSale(event)" class="form-grid"><div class="field"><label>ID PEDIDO</label><input name="id" value="PED-${1001+data.sales.length}" required></div><div class="field"><label>DATA DA VENDA</label><input type="date" name="saleDate" value="2026-08-20" required></div><div class="field full"><label>CLIENTE / CONTRATO</label><input name="client" required placeholder="Nome do cliente"></div><div class="field"><label>VENDEDOR</label><input name="seller" required placeholder="Nome do vendedor"></div><div class="field full"><label>PRODUTO</label><select name="product" required>${opts}</select></div><div class="field"><label>QUANTIDADE</label><input type="number" min="1" name="qty" value="1" required></div><div class="field"><label>DATA PREVISTA DE INSTALAÇÃO</label><input type="date" name="planned"></div><div class="field"><label>DATA DA INSTALAÇÃO</label><input type="date" name="installed"></div><div class="form-actions full"><button type="button" class="secondary" onclick="$('#modal').remove()">Cancelar</button><button class="primary">Salvar venda</button></div></form></div></div>`}
function addSale(e){e.preventDefault();let f=new FormData(e.target),id=String(f.get('id')||'').trim(),qty=Number(f.get('qty'));if(!id||data.sales.some(s=>s.id===id)){alert('Informe um ID de pedido único.');return}if(!f.get('client')||!f.get('product')||!Number.isFinite(qty)||qty<1){alert('Preencha os campos obrigatórios com valores válidos.');return}data.sales.push({id,saleDate:f.get('saleDate'),client:String(f.get('client')).trim(),seller:String(f.get('seller')||'').trim(),product:f.get('product'),qty,planned:f.get('planned'),installed:f.get('installed')||''});save();show('sales')}
function openSaleForm(id){let s=data.sales.find(x=>x.id===id);if(!s)return;let opts=data.products.map(p=>`<option ${p.name===s.product?'selected':''}>${esc(p.name)}</option>`).join('');$('#sales').innerHTML+=`<div class="panel" id="modal" style="position:fixed;inset:8%;z-index:10;overflow:auto;box-shadow:0 20px 70px #0d244066"><div class="panel-head"><h3>Alterar venda ${esc(s.id)}</h3><button onclick="$('#modal').remove()">✕</button></div><div class="panel-body"><form onsubmit="saveSaleEdit(event,'${esc(s.id)}')" class="form-grid"><div class="field"><label>ID PEDIDO</label><input name="id" value="${esc(s.id)}" required></div><div class="field"><label>DATA DA VENDA</label><input type="date" name="saleDate" value="${esc(s.saleDate)}" required></div><div class="field full"><label>CLIENTE / CONTRATO</label><input name="client" value="${esc(s.client)}" required></div><div class="field"><label>VENDEDOR</label><input name="seller" value="${esc(s.seller||s.vendedor||'')}" required placeholder="Nome do vendedor"></div><div class="field full"><label>PRODUTO</label><select name="product" required>${opts}</select></div><div class="field"><label>QUANTIDADE</label><input type="number" min="1" name="qty" value="${Number(s.qty)||1}" required></div><div class="field"><label>DATA PREVISTA DE INSTALAÇÃO</label><input type="date" name="planned" value="${esc(s.planned||'')}"></div><div class="field"><label>DATA DA INSTALAÇÃO</label><input type="date" name="installed" value="${esc(s.installed||'')}"></div><div class="form-actions full"><button type="button" class="secondary" onclick="$('#modal').remove()">Cancelar</button><button class="primary">Salvar alterações</button></div></form></div></div>`}
function saveSaleEdit(e,oldId){e.preventDefault();let f=new FormData(e.target),newId=String(f.get('id')||'').trim(),qty=Number(f.get('qty'));if(!newId||!f.get('client')||!f.get('product')||!Number.isFinite(qty)||qty<1){alert('Preencha os campos obrigatórios com valores válidos.');return}if(newId!==oldId&&data.sales.some(x=>x.id===newId)){alert('Já existe uma venda com este ID.');return}let s=data.sales.find(x=>x.id===oldId);if(!s)return;Object.assign(s,{id:newId,saleDate:f.get('saleDate'),client:String(f.get('client')).trim(),seller:String(f.get('seller')||'').trim(),product:f.get('product'),qty,planned:f.get('planned')||'',installed:f.get('installed')||''});save();show('sales')}
function handleSaleAction(action,id){if(action==='baixa')install(id);else if(action==='alterar')openSaleForm(id);else if(action==='excluir')deleteSale(id);}
function handleProductAction(action,code){if(action==='movimentar')openMovementForm(code);else if(action==='alterar')editProduct(code);else if(action==='excluir')deleteProduct(code);}
function deleteSale(id){let s=data.sales.find(x=>x.id===id);if(!s)return;if(confirm('Excluir a venda '+id+'? Esta ação não pode ser desfeita.')){data.sales=data.sales.filter(x=>x.id!==id);save();renderSales();renderDashboard();}}
function getSelected(kind){return [...document.querySelectorAll(kind==='sale'?'.sale-check:checked':'.product-check:checked')].map(x=>String(x.value))}
function updateBulkCount(kind){let ids=getSelected(kind),el=$(kind==='sale'?'#saleBulkCount':'#productBulkCount');if(el)el.textContent=ids.length+' selecionada'+(ids.length===1?'':'s');let all=document.querySelector(kind==='sale'?'#saleSelectAll':'#productSelectAll');let total=document.querySelectorAll(kind==='sale'?'.sale-check':'.product-check').length;if(all)all.checked=total>0&&ids.length===total}
function toggleAll(kind,checked){document.querySelectorAll(kind==='sale'?'.sale-check':'.product-check').forEach(x=>x.checked=checked);updateBulkCount(kind)}
function toggleAllSales(checked){if(typeof checked!=='boolean')checked=true;toggleAll('sale',checked)}
function toggleAllProducts(checked){if(typeof checked!=='boolean')checked=true;toggleAll('product',checked)}
function requireSelected(kind){let ids=getSelected(kind);if(!ids.length){alert('Selecione pelo menos um item.');return null}return ids}
function bulkDeleteSales(){let ids=requireSelected('sale');if(!ids)return;if(!confirm('Excluir '+ids.length+' venda(s) selecionada(s)? Esta ação não pode ser desfeita.'))return;data.sales=data.sales.filter(s=>!ids.includes(String(s.id)));save();renderSales();renderDashboard();renderStock()}
function bulkDeleteProducts(){let ids=requireSelected('product');if(!ids)return;let blocked=[],allowed=[];ids.forEach(code=>{let p=data.products.find(x=>String(x.code)===code);if(!p)return;let hasSales=data.sales.some(s=>s.product===p.name),hasMovements=data.movements.some(m=>String(m.code)===code);(hasSales||hasMovements?blocked:allowed).push(p)});if(!allowed.length){alert('Nenhum produto selecionado pode ser excluído: todos possuem vendas ou movimentações vinculadas.');return}if(!confirm('Excluir '+allowed.length+' produto(s) permitido(s)?'))return;let codes=new Set(allowed.map(p=>String(p.code)));data.products=data.products.filter(p=>!codes.has(String(p.code)));save();renderProducts();renderStock();renderDashboard();if(blocked.length)alert(allowed.length+' produto(s) excluído(s). '+blocked.length+' não excluído(s) por possuir vendas ou movimentações vinculadas.')}
function openBulkSaleEdit(){let ids=requireSelected('sale');if(!ids)return;let opts=data.products.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');$('#sales').innerHTML+=`<div class="panel" id="bulkModal" style="position:fixed;inset:8%;z-index:10;overflow:auto;box-shadow:0 20px 70px #0d244066"><div class="panel-head"><h3>Alterar vendas selecionadas</h3><button onclick="$('#bulkModal').remove()">✕</button></div><div class="panel-body"><p style="color:var(--muted);font-size:12px">Deixe em branco os campos que não deseja alterar.</p><form onsubmit="saveBulkSaleEdit(event)" class="form-grid"><input type="hidden" name="ids" value="${esc(ids.join('|'))}"><div class="field"><label>CLIENTE</label><input name="client" placeholder="Sem alteração"></div><div class="field"><label>PRODUTO</label><select name="product"><option value="">Sem alteração</option>${opts}</select></div><div class="field"><label>QUANTIDADE</label><input type="number" min="1" name="qty" placeholder="Sem alteração"></div><div class="field"><label>DATA DA VENDA</label><input type="date" name="saleDate"></div><div class="field"><label>DATA PREVISTA</label><input type="date" name="planned"></div><div class="field"><label>DATA DA INSTALAÇÃO</label><input type="date" name="installed"></div><div class="form-actions full"><button type="button" class="secondary" onclick="$('#bulkModal').remove()">Cancelar</button><button class="primary">Aplicar alterações</button></div></form></div></div>`}
function saveBulkSaleEdit(e){e.preventDefault();let f=new FormData(e.target),ids=String(f.get('ids')).split('|'),qty=f.get('qty')?Number(f.get('qty')):null;if(qty!==null&&(!Number.isFinite(qty)||qty<1)){alert('Informe uma quantidade válida.');return}let fields={};['client','product','saleDate','planned','installed'].forEach(k=>{let v=String(f.get(k)||'').trim();if(v)fields[k]=v});data.sales.filter(s=>ids.includes(String(s.id))).forEach(s=>{Object.assign(s,fields);if(qty!==null)s.qty=qty});save();$('#bulkModal')?.remove();renderSales();renderDashboard();renderStock()}
function openBulkProductEdit(){let ids=requireSelected('product');if(!ids)return;$('#products').innerHTML+=`<div class="panel" id="bulkModal" style="position:fixed;inset:8%;z-index:10;overflow:auto;box-shadow:0 20px 70px #0d244066"><div class="panel-head"><h3>Alterar produtos selecionados</h3><button onclick="$('#bulkModal').remove()">✕</button></div><div class="panel-body"><p style="color:var(--muted);font-size:12px">Deixe em branco os campos que não deseja alterar.</p><form onsubmit="saveBulkProductEdit(event)" class="form-grid"><input type="hidden" name="ids" value="${esc(ids.join('|'))}"><div class="field"><label>CATEGORIA</label><input name="category" placeholder="Sem alteração"></div><div class="field"><label>MÍNIMO</label><input type="number" min="0" name="min" placeholder="Sem alteração"></div><div class="field"><label>MÁXIMO</label><input type="number" min="0" name="max" placeholder="Sem alteração"></div><div class="form-actions full"><button type="button" class="secondary" onclick="$('#bulkModal').remove()">Cancelar</button><button class="primary">Aplicar alterações</button></div></form></div></div>`}
function saveBulkProductEdit(e){e.preventDefault();let f=new FormData(e.target),ids=String(f.get('ids')).split('|'),min=f.get('min')?Number(f.get('min')):null,max=f.get('max')?Number(f.get('max')):null;if([min,max].some(v=>v!==null&&(!Number.isFinite(v)||v<0))){alert('Informe limites válidos.');return}let category=String(f.get('category')||'').trim();data.products.filter(p=>ids.includes(String(p.code))).forEach(p=>{if(category)p.category=category;if(min!==null)p.min=min;if(max!==null)p.max=max});save();$('#bulkModal')?.remove();renderProducts();renderStock();renderDashboard()}
function editProduct(code){let p=data.products.find(x=>String(x.code)===String(code));if(!p)return;$('#products').innerHTML+=`<div class="panel" id="productModal" style="position:fixed;inset:8%;z-index:10;overflow:auto;box-shadow:0 20px 70px #0d244066"><div class="panel-head"><h3>Alterar todas as informações do produto</h3><button onclick="$('#productModal').remove()">✕</button></div><div class="panel-body"><form onsubmit="saveProductEdit(event,'${esc(p.code)}')" class="form-grid"><div class="field"><label>CÓDIGO DO PRODUTO</label><input name="code" value="${esc(p.code)}" required></div><div class="field"><label>PRODUTO</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>CATEGORIA</label><input name="category" value="${esc(p.category)}" required></div><div class="field"><label>ESTOQUE INICIAL</label><input type="number" min="0" step="1" name="initial" value="${Number(p.initial)||0}" required></div><div class="field"><label>MÍNIMO</label><input type="number" min="0" step="1" name="min" value="${Number(p.min)||0}" required></div><div class="field"><label>MÁXIMO</label><input type="number" min="0" step="1" name="max" value="${Number(p.max)||0}" required></div><div class="form-actions full"><button type="button" class="secondary" onclick="$('#productModal').remove()">Cancelar</button><button class="primary">Salvar alterações</button></div></form></div></div>`}
function saveProductEdit(e,oldCode){e.preventDefault();let f=new FormData(e.target),newCode=String(f.get('code')||'').trim(),name=String(f.get('name')||'').trim(),category=String(f.get('category')||'').trim(),initial=Number(f.get('initial')),min=Number(f.get('min')),max=Number(f.get('max'));let p=data.products.find(x=>String(x.code)===String(oldCode));if(!p)return;if(!newCode||!name||!category||!Number.isFinite(initial)||initial<0||![min,max].every(Number.isFinite)||[min,max].some(x=>x<0)){alert('Preencha os campos com valores válidos.');return}if(data.products.some(x=>x!==p&&String(x.code).trim().toLowerCase()===newCode.toLowerCase())){alert('Já existe outro produto com este código.');return}if(data.products.some(x=>x!==p&&String(x.name).trim().toLowerCase()===name.toLowerCase())){alert('Já existe outro produto com este nome.');return}let oldName=p.name;Object.assign(p,{code:newCode,name,category,initial,min,max});data.sales.forEach(s=>{if(s.product===oldName)s.product=name});save();$('#productModal')?.remove();renderProducts();renderStock();renderDashboard();}
function deleteProduct(code){let p=data.products.find(x=>String(x.code)===String(code));if(!p)return;let hasSales=data.sales.some(s=>s.product===p.name),hasMovements=data.movements.some(m=>String(m.code)===String(p.code));if(hasSales||hasMovements){let reason=hasSales&&hasMovements?'vendas e movimentações vinculadas':hasSales?'vendas vinculadas':'movimentações de estoque vinculadas';alert('Este produto não pode ser excluído porque possui '+reason+'.');return}if(confirm('Excluir o produto '+p.name+'? Esta ação não pode ser desfeita.')){data.products=data.products.filter(x=>String(x.code)!==String(code));save();renderProducts();renderStock();renderDashboard();}}
function install(id){let s=data.sales.find(x=>x.id===id);if(!s)return;s.installed='2026-08-20';save();renderSales();renderStock();renderDashboard()}
function openMovementForm(code=''){let p=data.products.find(x=>String(x.code)===String(code));let opts=data.products.map(x=>`<option value="${esc(x.code)}" ${p&&x.code===p.code?'selected':''}>${esc(x.code)} · ${esc(x.name)}</option>`).join('');$('#movements').innerHTML+=`<div class="panel" id="movementModal" style="position:fixed;inset:8%;z-index:10;overflow:auto;box-shadow:0 20px 70px #0d244066"><div class="panel-head"><h3>Movimentar estoque</h3><button onclick="$('#movementModal').remove()">✕</button></div><div class="panel-body"><form onsubmit="addMovement(event)" class="form-grid"><div class="field full"><label>PRODUTO / CÓDIGO DE BARRAS</label><select name="code" required>${opts}</select></div><div class="field"><label>TIPO</label><select name="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div><div class="field"><label>QUANTIDADE</label><input type="number" name="qty" min="1" step="1" value="1" required></div><div class="field full"><label>OBSERVAÇÃO</label><input name="note" placeholder="Ex.: compra, ajuste, avaria..."></div><div class="form-actions full"><button type="button" class="secondary" onclick="$('#movementModal').remove()">Cancelar</button><button class="primary">Salvar movimentação</button></div></form></div></div>`}
function addMovement(e){e.preventDefault();let f=new FormData(e.target),code=String(f.get('code')),type=String(f.get('type')),qty=Number(f.get('qty')),p=data.products.find(x=>String(x.code)===code);if(!p||!Number.isFinite(qty)||qty<1){alert('Selecione um produto e informe uma quantidade válida.');return}if(type==='saida'&&productStats(p).available<qty){alert('A saída não pode deixar o estoque negativo.');return}data.movements.push({date:new Date().toISOString().slice(0,10),code,name:p.name,type,qty,note:String(f.get('note')||'').trim()});save();$('#movementModal')?.remove();renderMovements();renderStock();renderProducts();renderDashboard()}
function openProductForm(){$('#products').innerHTML+=`<div class="panel" id="productModal" style="position:fixed;inset:8%;z-index:10;overflow:auto;box-shadow:0 20px 70px #0d244066"><div class="panel-head"><h3>Cadastrar produto</h3><button onclick="$('#productModal').remove()">✕</button></div><div class="panel-body"><form onsubmit="addProduct(event)" class="form-grid"><div class="field"><label>CÓDIGO DO PRODUTO</label><input name="code" required></div><div class="field"><label>PRODUTO</label><input name="name" required></div><div class="field"><label>CATEGORIA</label><input name="category" value="Sem categoria" required></div><div class="field"><label>ESTOQUE INICIAL</label><input type="number" min="0" step="1" name="initial" value="0" required></div><div class="field"><label>MÍNIMO</label><input type="number" min="0" step="1" name="min" value="0" required></div><div class="field"><label>MÁXIMO</label><input type="number" min="0" step="1" name="max" value="0" required></div><div class="form-actions full"><button type="button" class="secondary" onclick="$('#productModal').remove()">Cancelar</button><button class="primary">Salvar produto</button></div></form></div></div>`}
function addProduct(e){e.preventDefault();let f=new FormData(e.target),code=String(f.get('code')||'').trim(),name=String(f.get('name')||'').trim(),category=String(f.get('category')||'').trim()||'Sem categoria',initial=Number(f.get('initial')),min=Number(f.get('min')),max=Number(f.get('max'));if(!code||!name||![initial,min,max].every(Number.isFinite)||[initial,min,max].some(x=>x<0)){alert('Preencha os campos com valores válidos.');return}if(data.products.some(p=>String(p.code).trim().toLowerCase()===code.toLowerCase())){alert('Já existe um produto com este código.');return}if(data.products.some(p=>String(p.name).trim().toLowerCase()===name.toLowerCase())){alert('Já existe um produto com este nome.');return}data.products.push({code,name,category,initial,min,max});save();$('#productModal')?.remove();renderProducts();renderStock();renderDashboard()}

function formatDate(value){if(!value)return '—';let parts=String(value).slice(0,10).split('-');return parts.length===3&&parts[0].length===4?parts.reverse().join('/'):String(value)}
function compareValues(a,b){return String(a??'').localeCompare(String(b??''),'pt-BR',{numeric:true,sensitivity:'base'})}
function productStatusLabel(p){return p.invalidLimits?'Limites inválidos':p.purchase}
function renderSales(){let q=($('#saleSearch')?.value||'').toLowerCase(),statusFilter=$('#saleFilter')?.value||'',productFilter=$('#saleProductFilter')?.value||'',sort=$('#saleSort')?.value||'date-desc';let products=[...new Set(data.sales.map(s=>s.product))].sort(compareValues);$('#sales').innerHTML=`<div class="hero"><div><h2>Vendas e instalações</h2><p>Registre pedidos e acompanhe a execução das instalações.</p></div><button class="primary" onclick="openForm()">＋ Registrar venda</button></div><div class="toolbar"><input class="search" id="saleSearch" value="${esc(q)}" placeholder="Pesquisar por pedido, cliente ou produto..." oninput="filterSales()"><select class="select" id="saleFilter" onchange="filterSales()"><option value="">Todos os status</option><option ${statusFilter==='Aguardando instalação'?'selected':''}>Aguardando instalação</option><option ${statusFilter==='Instalado'?'selected':''}>Instalado</option><option ${statusFilter==='Atrasado'?'selected':''}>Atrasado</option></select><select class="select" id="saleProductFilter" onchange="filterSales()"><option value="">Todos os produtos</option>${products.map(x=>`<option value="${esc(x)}" ${productFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="select" id="saleSort" onchange="filterSales()"><option value="date-desc" ${sort==='date-desc'?'selected':''}>Mais recentes</option><option value="date-asc" ${sort==='date-asc'?'selected':''}>Mais antigas</option><option value="client" ${sort==='client'?'selected':''}>Cliente A–Z</option><option value="product" ${sort==='product'?'selected':''}>Produto A–Z</option><option value="status" ${sort==='status'?'selected':''}>Status</option></select></div><div class="bulk-toolbar"><span class="bulk-count" id="saleBulkCount">0 selecionadas</span><button class="secondary" onclick="toggleAllSales()">Selecionar todas</button><button class="secondary" onclick="openBulkSaleEdit()">Alterar selecionadas</button><button class="secondary" style="color:var(--red)" onclick="bulkDeleteSales()">Excluir selecionadas</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th class="check-cell"><input class="select-all" id="saleSelectAll" type="checkbox" onchange="toggleAllSales(this.checked)"></th><th>Pedido</th><th>Cliente</th><th>Vendedor</th><th>Produto</th><th>Qtd.</th><th>Data da venda</th><th>Inst. Prevista</th><th>Inst. Realizada</th><th>Status</th><th>Ações</th></tr></thead><tbody id="salesRows">${salesRows(data.sales.filter(s=>(!q||[s.id,s.client,s.product].join(' ').toLowerCase().includes(q))&&(!statusFilter||status(s)[0]===statusFilter)&&(!productFilter||s.product===productFilter)))}</tbody></table></div></div>`}
function salesRows(rows){let selected=new Set(getSelected('sale'));return rows.slice().sort((a,b)=>{let sort=$('#saleSort')?.value||'date-desc';if(sort==='date-asc'||sort==='date-desc'){let c=compareValues(a.saleDate,b.saleDate);return sort==='date-asc'?c:c*-1}if(sort==='client')return compareValues(a.client,b.client);if(sort==='product')return compareValues(a.product,b.product);return compareValues(status(a)[0],status(b)[0])}).map(s=>{let [st,cl]=status(s);return `<tr><td class="check-cell"><input class="row-check sale-check" type="checkbox" value="${esc(s.id)}" ${selected.has(String(s.id))?'checked':''} onchange="updateBulkCount('sale')"></td><td><b>${esc(s.id)}</b></td><td>${esc(s.client)}</td><td>${esc(s.product)}</td><td>${s.qty}</td><td>${formatDate(s.saleDate)}</td><td>${formatDate(s.planned)}</td><td>${formatDate(s.installed)}</td><td><span class="pill ${cl}">${st}</span></td><td style="display:flex;gap:6px;align-items:center">${!s.installed?`<button class="secondary" style="padding:6px 8px;font-size:10px" onclick="install('${esc(s.id)}')">Dar baixa</button>`:''}<button class="secondary" style="padding:6px 8px;font-size:10px" onclick="openSaleForm('${esc(s.id)}')">Alterar</button><button class="secondary" style="padding:6px 8px;font-size:10px;color:var(--red)" onclick="deleteSale('${esc(s.id)}')">Excluir</button></td></tr>`}).join('')||'<tr><td colspan="11" class="empty">Nenhum lançamento encontrado.</td></tr>';setTimeout(()=>updateBulkCount('sale'),0)}
function filterSales(){let q=($('#saleSearch')?.value||'').toLowerCase(),f=$('#saleFilter')?.value||'',pf=$('#saleProductFilter')?.value||'';let rows=data.sales.filter(s=>(!q||[s.id,s.client,s.product].join(' ').toLowerCase().includes(q))&&(!f||status(s)[0]===f)&&(!pf||s.product===pf));$('#salesRows').innerHTML=salesRows(rows)}
function renderProducts(){let q=($('#prodSearch')?.value||'').toLowerCase(),cat=$('#prodCategoryFilter')?.value||'',st=$('#prodStatusFilter')?.value||'',sort=$('#prodSort')?.value||'name';let cats=[...new Set(data.products.map(p=>p.category||'Sem categoria'))].sort(compareValues),selected=new Set(getSelected('product'));let rows=data.products.filter(p=>{let ps=productStats(p);return (!q||[p.code,p.name,p.category].join(' ').toLowerCase().includes(q))&&(!cat||p.category===cat)&&(!st||productStatusLabel(ps)===st)}).sort((a,b)=>{let pa=productStats(a),pb=productStats(b);if(sort==='category')return compareValues(a.category,b.category)||compareValues(a.name,b.name);if(sort==='stock')return Number(pb.available)-Number(pa.available);if(sort==='status')return compareValues(productStatusLabel(pa),productStatusLabel(pb));return compareValues(a.name,b.name)});let statuses=['Comprar','Repor quando necessário','Estoque adequado','Limites inválidos'];$('#products').innerHTML=`<div class="hero"><div><h2>Produtos</h2><p>${data.products.length} produtos cadastrados, sem duplicidade por código.</p></div><button class="primary" onclick="openProductForm()">＋ Adicionar produto</button></div><div class="toolbar"><input class="search" id="prodSearch" value="${esc(q)}" placeholder="Pesquisar por código, produto ou categoria..." oninput="renderProducts()"><select class="select" id="prodCategoryFilter" onchange="renderProducts()"><option value="">Todas as categorias</option>${cats.map(c=>`<option value="${esc(c)}" ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="select" id="prodStatusFilter" onchange="renderProducts()"><option value="">Todos os status</option>${statuses.map(x=>`<option ${st===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" id="prodSort" onchange="renderProducts()"><option value="name" ${sort==='name'?'selected':''}>Produto A–Z</option><option value="category" ${sort==='category'?'selected':''}>Categoria A–Z</option><option value="stock" ${sort==='stock'?'selected':''}>Maior estoque</option><option value="status" ${sort==='status'?'selected':''}>Status</option></select></div><div class="bulk-toolbar"><span class="bulk-count" id="productBulkCount">0 selecionados</span><button class="secondary" onclick="toggleAllProducts()">Selecionar todos</button><button class="secondary" onclick="openBulkProductEdit()">Alterar selecionados</button><button class="secondary" style="color:var(--red)" onclick="bulkDeleteProducts()">Excluir selecionados</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th class="check-cell"><input class="select-all" id="productSelectAll" type="checkbox" onchange="toggleAllProducts(this.checked)"></th><th>Código</th><th>Produto</th><th>Categoria</th><th>Estoque inicial</th><th>Mínimo</th><th>Máximo</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(p=>{let ps=productStats(p);return `<tr><td class="check-cell"><input class="row-check product-check" type="checkbox" value="${esc(p.code)}" ${selected.has(String(p.code))?'checked':''} onchange="updateBulkCount('product')"></td><td>${esc(p.code)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td class="num-cell">${Number(p.initial)||0}</td><td class="num-cell">${p.min??0}</td><td class="num-cell">${p.max??0}${ps.invalidLimits?'<br><span class="invalid-limit">configuração inválida</span>':''}</td><td>${purchasePill(ps)}</td><td><select class="action-select" onchange="handleProductAction(this.value,'${esc(p.code)}');this.value=''"><option value="">Selecionar</option><option value="movimentar">Movimentar</option><option value="alterar">Alterar</option><option value="excluir">Excluir</option></select></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Nenhum produto encontrado.</td></tr>'}</tbody></table></div></div>`;setTimeout(()=>updateBulkCount('product'),0)}
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');show('dashboard');
</script><script>

 const originalShow=window.show;
 window.show=function(view){ originalShow(view); if(window.appRole==='operador'){ document.querySelectorAll('[onclick*="delete"],[onclick*="openBulk"],[onclick*="editProduct"]').forEach(el=>el.style.display='none'); } };
})();
</script>
